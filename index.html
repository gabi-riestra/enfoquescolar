<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Enfoque Escolar · Asistente de estudio</title>
  <meta name="description" content="Organiza tus entregas, horarios, actividades y pomodoros. Todo se guarda en tu dispositivo, sin cuentas ni internet.">
  <meta name="theme-color" content="#120a20">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Enfoque">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
    <symbol id="i-timeline" viewBox="0 0 24 24">
      <path d="M2.5 12h19"/><circle cx="7" cy="12" r="2.2"/><circle cx="13" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/>
    </symbol>
    <symbol id="i-deadline" viewBox="0 0 24 24">
      <path d="M6 21V3"/><path d="M6 4h12l-2.6 4L18 12H6"/>
    </symbol>
    <symbol id="i-schedule" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>
    </symbol>
    <symbol id="i-note" viewBox="0 0 24 24">
      <path d="M5 4h14v11l-5 5H5z"/><path d="M14 20v-5h5"/><path d="M8.5 9h7M8.5 12.5h5"/>
    </symbol>
    <symbol id="i-chart" viewBox="0 0 24 24">
      <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5l11 6.5-11 6.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3.2"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2z"/></symbol>
    <symbol id="i-install" viewBox="0 0 24 24"><path d="M12 3v11M7.5 9.5L12 14l4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.4 2"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v11M7.5 9.5L12 14l4.5-4.5M4 18.5V20a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1.5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 14V3M7.5 7.5L12 3l4.5 4.5M4 18.5V20a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5L22 20H2z"/><path d="M12 9v5M12 17.2v.1"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.4l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.3l-5.9 3.1 1.2-6.5L2.5 9.3l6.6-.9z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M7.5 14h2M11 14h2M14.5 14h2M7.5 17.5h2M11 17.5h2"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h15M14 7l5 5-5 5"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1.4" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.2"/><path d="M20 4v7h-7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V3"/><path d="M6 4h12l-2.6 4L18 12H6"/></symbol>
  </svg>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark"><svg class="icon"><use href="#i-star"></use></svg></div>
        <div class="brand-text">
          <strong>Enfoque Escolar</strong>
          <span>Asistente de estudio</span>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Secciones">
        <button type="button" class="nav-item" data-nav="timeline">
          <svg class="icon"><use href="#i-timeline"></use></svg><span>Línea de tiempo</span>
        </button>
        <button type="button" class="nav-item" data-nav="deadlines">
          <svg class="icon"><use href="#i-deadline"></use></svg><span>Entregas</span>
        </button>
        <button type="button" class="nav-item" data-nav="schedules">
          <svg class="icon"><use href="#i-schedule"></use></svg><span>Horarios</span>
        </button>
        <button type="button" class="nav-item" data-nav="postits">
          <svg class="icon"><use href="#i-note"></use></svg><span>Pendientes</span>
        </button>
        <button type="button" class="nav-item" data-nav="summary">
          <svg class="icon"><use href="#i-chart"></use></svg><span>Resumen</span>
        </button>
        <button type="button" class="nav-item" data-nav="settings">
          <svg class="icon"><use href="#i-settings"></use></svg><span>Ajustes</span>
        </button>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="timer-card" id="timerCard" aria-live="polite"></div>

      <div class="sidebar-footer">
        <button type="button" class="theme-toggle" id="themeBtn" title="Cambiar tema">
          <span class="theme-ico theme-ico-dark"><svg class="icon"><use href="#i-moon"></use></svg></span>
          <span class="theme-ico theme-ico-light"><svg class="icon"><use href="#i-sun"></use></svg></span>
          <span class="theme-label">Tema</span>
        </button>
        <button type="button" class="install-btn hidden" id="installBtn">
          <svg class="icon"><use href="#i-install"></use></svg><span>Instalar</span>
        </button>
      </div>
      <p class="local-note"><svg class="icon"><use href="#i-check"></use></svg> Todo se guarda en tu dispositivo</p>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="pageTitle">Línea de tiempo</h1>
          <p id="pageSubtitle">Tus entregas, horarios y actividades en un solo lugar</p>
        </div>
        <div class="topbar-actions">
          <button type="button" class="mini-timer hidden" id="miniTimer" title="Abrir pomodoro">
            <svg class="icon"><use href="#i-clock"></use></svg><span id="miniTimerText">25:00</span>
          </button>
          <div class="clock">
            <span id="clockTime">--:--</span>
            <small id="clockDate"></small>
          </div>
          <button type="button" class="icon-btn mobile-only" id="themeBtnMobile" title="Cambiar tema">
            <svg class="icon"><use href="#i-moon"></use></svg>
          </button>
          <button type="button" class="icon-btn mobile-only hidden" id="installBtnMobile" title="Instalar app">
            <svg class="icon"><use href="#i-install"></use></svg>
          </button>
        </div>
      </header>

      <section class="view" id="view" tabindex="-1"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js"></script>
</body>
</html>
